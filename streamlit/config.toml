[theme]
base = "dark"
# "Midnight Aurora" palette: deep navy surfaces, sky-blue primary, violet accent,
# soft semantic colours chosen for contrast on dark backgrounds (WCAG AA for text).
primaryColor = "#38BDF8"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#131B2E"
textColor = "#E2E8F0"
linkColor = "#7DD3FC"
borderColor = "#1F2A44"
dataframeBorderColor = "#1F2A44"
dataframeHeaderBackgroundColor = "#16213A"
dataframeHeaderTextColor = "#CBD5E1"
codeBackgroundColor = "#0F172A"
showWidgetBorder = true
baseRadius = "10px"
font = "sans serif"
redColor = "#F87171"
orangeColor = "#FB923C"
yellowColor = "#FBBF24"
blueColor = "#60A5FA"
greenColor = "#34D399"
violetColor = "#A78BFA"
grayColor = "#94A3B8"
chartCategoricalColors = ["#38BDF8", "#A78BFA", "#34D399", "#FBBF24", "#F472B6", "#FB923C", "#2DD4BF", "#818CF8", "#F87171", "#94A3B8"]
chartSequentialColors = ["#0F172A", "#0C2D48", "#0B4A6F", "#0369A1", "#0284C7", "#0EA5E9", "#38BDF8", "#7DD3FC", "#BAE6FD", "#E0F2FE"]

[theme.sidebar]
backgroundColor = "#0E1627"
secondaryBackgroundColor = "#16213A"
borderColor = "#1F2A44"

[server]
headless = true

[browser]
gatherUsageStats = false
